name: ci
on:
  push:
  pull_request:

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # Each job below starts its own Supabase stack, so they run side by side and a failure names the area at once.
  db:
    # Real local Supabase (Postgres, Auth, Realtime, Storage), migrations + seed applied by the CLI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cp .env.example .env
      - run: pnpm supabase start
      - run: pnpm --filter @courier/db test

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cp .env.example .env
      - run: pnpm supabase start
      - run: pnpm --filter @courier/api test

  e2e:
    # The whole product: Supabase CLI stack + docker compose (api, web, sender stub) + Playwright in real Chromium.
    # One job per spec file; every job has its own stack.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spec: [required, ui, audit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cp .env.example .env
      - run: echo "WEBHOOK_BACKOFF_BASE_SECONDS=2" >> .env # the e2e waits for retries
      - run: pnpm supabase start
      - run: docker compose up --build -d --wait
      - run: pnpm --filter @courier/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @courier/e2e exec playwright test tests/${{ matrix.spec }}.spec.ts
      - if: failure()
        run: docker compose logs --no-color | tail -200
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.spec }}
          path: e2e/playwright-report
