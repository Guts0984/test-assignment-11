packages:
  - apps/*
  - packages/*
allowBuilds:
  '@parcel/watcher': set this to true or false
  '@scarf/scarf': set this to true or false
  '@swc/core': set this to true or false
  esbuild: set this to true or false
onlyBuiltDependencies:
  - supabase
  - esbuild
  - sharp
  - '@nestjs/core'
  - unrs-resolver
ignoredBuiltDependencies:
  - '@scarf/scarf'
